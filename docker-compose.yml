version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_NOMBRE=${DB_NOMBRE}
      - DB_USUARIO=${DB_USUARIO}
      - DB_CLAVE=${DB_CLAVE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
    depends_on:
      - db
    # Audios e imágenes subidos desde el panel (HU19/HU21). Sin volumen se
    # borraban en cada despliegue, porque viven dentro del contenedor.
    volumes:
      - uploads:/var/www/html/assets/uploads
    networks:
      - smashcode_network
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_CLAVE:-root}
      MYSQL_DATABASE: smash_code
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - smashcode_network
volumes:
  db_data:
  uploads:
networks:
  smashcode_network:
    driver: bridge
