version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_NOMBRE=${DB_NOMBRE}
      - DB_USUARIO=${DB_USUARIO}
      - DB_CLAVE=${DB_CLAVE}
      # URL pública. Sin ella los enlaces de los correos (activación de cuenta,
      # recuperación, clave temporal) se arman con el Host de la petición, que
      # detrás de un proxy no siempre es el dominio real.
      - APP_URL=${APP_URL}
      - APP_ENV=${APP_ENV:-production}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-SmashCode}
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-smtp}
      # En false el auto-registro deja de exigir activación por correo (RF-01):
      # sin correo que enviar, la cuenta se habilita sola.
      - MAIL_ENABLED=${MAIL_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
    depends_on:
      - db
    # Audios e imágenes subidos desde el panel (HU19/HU21). Sin volumen se
    # borraban en cada despliegue, porque viven dentro del contenedor.
    volumes:
      - uploads:/var/www/html/assets/uploads
    networks:
      - smashcode_network
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_CLAVE:-root}
      MYSQL_DATABASE: smash_code
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - smashcode_network
volumes:
  db_data:
  uploads:
networks:
  smashcode_network:
    driver: bridge
